<div id="login" class="login"><div class="loginbox"><div class="logo">PES <span style="color:white">CLASSIC</span> ROOM<div class="sub" style="font-size:13px">MASTER LEAGUE EDITION</div></div><form id="loginForm" class="panel stack"><input id="username" placeholder="Username" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="gold">ACCEDI</button><div id="loginError" class="error"></div></form></div></div>

<div id="app" class="app hidden"><aside><div class="brand">PES CLASSIC ROOM</div><nav class="nav"><button data-view="rooms" class="active">⚽ Chat Rooms</button><button data-view="users" class="adminOnly">👥 Utenti</button><button data-view="settings" class="adminOnly">⚙ Impostazioni</button></nav><p id="who" class="muted"></p><button id="logout">Esci</button></aside><main><header><h1 id="heading">Chat Rooms</h1><span class="status">● ONLINE</span></header><div id="content"></div></main><div class="floating"><button id="privateButton">✉ <span id="privateTitle">Contatta ADMIN</span> <span id="unread" class="badge hidden"></span></button></div></div>
<div id="privatePanel" class="private hidden"></div><div id="overlay" class="overlay hidden"><div class="dialog panel"><div class="row between"><h2 id="dialogTitle"></h2><button id="closeDialog">✕</button></div><div id="dialogBody" class="stack"></div><div class="row" style="margin-top:14px"><button id="dialogSave" class="gold">Salva</button></div></div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
// Paste only the public Project URL and publishable/anon key from Supabase. NEVER service_role.
const SUPABASE_URL='INCOLLA_URL_SUPABASE';
const SUPABASE_KEY='INCOLLA_CHIAVE_PUBBLICA';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_KEY.startsWith('INCOLLA');
const sb=configured?createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;
const $=s=>document.querySelector(s),node=(tag,text='',className='')=>{const x=document.createElement(tag);x.textContent=text;x.className=className;return x};const add=(p,...children)=>p.append(...children);const button=(text,action,cls='')=>{const b=node('button',text,cls);b.onclick=action;return b};const fmt=d=>new Date(d).toLocaleString('it-IT');const fail=e=>alert(e?.message||String(e));
let me=null,profile=null,rooms=[],profiles=[],access=[],current=null,view='rooms',channel=null,privateOpen=false,peer=null,mute=false,privateData=[],seen=new Set(),lastPublic=new Set(),lastPrivate=new Set(),ready=false,files=null,closing=false;
const isAdmin=()=>profile?.role==='admin';const username=id=>profiles.find(p=>p.id===id)?.username||'Utente';const canRoom=r=>isAdmin()||access.some(a=>a.room_id===r.id&&a.user_id===me.id);
const request=async(q)=>{const {data,error}=await q;if(error)throw error;return data};
async function load(){profiles=await request(sb.from('profiles').select('id,username,role,archived,created_at'));rooms=await request(sb.from('rooms').select('*').order('created_at',{ascending:false}));access=await request(sb.from('room_access').select('*'));}
async function enter(){const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}me=session.user;const p=await request(sb.from('profiles').select('*').eq('id',me.id).single());profile=p;if(p.archived){await sb.auth.signOut();showLogin();return}const settings=await request(sb.from('settings').select('maintenance').single());if(settings.maintenance&&!isAdmin()){$('#login').classList.add('hidden');$('#app').classList.add('hidden');$('#maintenance').classList.remove('hidden');return}$('#login').classList.add('hidden');$('#maintenance').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=p.username+' · '+p.role.toUpperCase();$('#privateTitle').textContent=isAdmin()?'Contatta utenti':'Contatta ADMIN';document.querySelectorAll('.adminOnly').forEach(x=>x.classList.toggle('hidden',!isAdmin()));await load();subscribe();await loadPrivate();render();}
function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');$('#maintenance').classList.add('hidden');me=null;profile=null;if(channel){sb.removeChannel(channel);channel=null}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';if(!configured){$('#loginError').textContent='Configura URL e chiave pubblica Supabase nel file HTML.';return}try{const name=$('#username').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(name))throw Error('Username non valido');await request(sb.auth.signInWithPassword({email:`${name}@pcr.invalid`,password:$('#password').value}));await enter()}catch(err){$('#loginError').textContent=err.message}};
$('#logout').onclick=async()=>{closing=true;await sb.auth.signOut();showLogin();closing=false};
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('pcr-live-'+me.id).on('postgres_changes',{event:'*',schema:'public',table:'rooms'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'room_access'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'settings'},async()=>{const x=await request(sb.from('settings').select('*').single());if(x.maintenance&&!isAdmin()){$('#app').classList.add('hidden');$('#maintenance').classList.remove('hidden')}else{$('#maintenance').classList.add('hidden');$('#app').classList.remove('hidden')}}).on('postgres_changes',{event:'*',schema:'public',table:'messages'},async()=>{if(current)await renderChat(true)}).on('postgres_changes',{event:'*',schema:'public',table:'private_messages'},async()=>{await loadPrivate(true);if(privateOpen)renderPrivate()}).subscribe()}
async function refresh(){try{await load();if(current&&!rooms.some(r=>r.id===current.id&&canRoom(r)&&(!r.closed||isAdmin())))current=null;else if(current)current=rooms.find(r=>r.id===current.id);render()}catch(e){console.error(e)}}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#heading').textContent=current?.name||(view==='rooms'?'Chat Rooms':view==='users'?'Utenti':'Impostazioni');if(current)renderChat();else if(view==='rooms')renderRooms();else if(view==='users')renderUsers();else renderSettings()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(!isAdmin()&&b.dataset.view!=='rooms')return;view=b.dataset.view;current=null;render()});
function dialog(title,setup,submit,label='Salva'){const body=$('#dialogBody');body.replaceChildren();$('#dialogTitle').textContent=title;setup(body);$('#dialogSave').textContent=label;$('#dialogSave').onclick=async()=>{try{await submit();$('#overlay').classList.add('hidden');await refresh()}catch(e){fail(e)}};$('#overlay').classList.remove('hidden')}
$('#closeDialog').onclick=()=>$('#overlay').classList.add('hidden');
function input(p,label,value='',type='text'){const x=node('input');x.placeholder=label;x.setAttribute('aria-label',label);x.type=type;x.value=value;p.append(x);return x}
function renderRooms(){const c=$('#content');c.replaceChildren();const box=node('section','','panel'),head=node('div','','row between');add(head,node('h2','Stanze disponibili'));if(isAdmin())head.append(button('＋ Crea room',()=>roomDialog()));box.append(head);const visible=rooms.filter(r=>isAdmin()||(!r.closed&&canRoom(r)));if(!visible.length)box.append(node('p','Nessuna stanza disponibile.','notice'));
visible.forEach(r=>{const row=node('div','','item clickable'),info=node('div');add(info,node('strong',r.name),node('div',fmt(r.created_at)+(r.closed?' · CHIUSA':''),'muted'));row.append(info);row.onclick=()=>{if(isAdmin())roomDialog(r);else{current=r;render()}};if(isAdmin()){row.ondblclick=e=>{e.preventDefault();changeRoom(r,{closed:!r.closed})};const actions=node('div','','actions');add(actions,button('Entra',()=>{current=r;render()}),button(r.closed?'Riattiva':'Chiudi',()=>changeRoom(r,{closed:!r.closed})),button(r.archived?'Ripristina':'Archivia conversazioni',()=>changeRoom(r,{archived:!r.archived})),button('Elimina',async()=>{if(confirm('Eliminare definitivamente la stanza e tutti i messaggi?'))try{await request(sb.from('rooms').delete().eq('id',r.id));await refresh()}catch(e){fail(e)}},'danger'));actions.onclick=e=>e.stopPropagation();row.append(actions)}box.append(row)});c.append(box)}
async function changeRoom(r,data){try{await request(sb.from('rooms').update(data).eq('id',r.id));await refresh()}catch(e){fail(e)}}
function roomDialog(r){let name;dialog(r?'Modifica stanza':'Crea room',p=>{name=input(p,'Nome stanza',r?.name||'')},async()=>{if(!name.value.trim())throw Error('Inserisci il nome');if(r)await request(sb.from('rooms').update({name:name.value.trim()}).eq('id',r.id));else await request(sb.from('rooms').insert({name:name.value.trim()}))},r?'Salva':'Apri')}
function roomSelector(p,selected=[]){const wrap=node('div');const all=node('label','');const allCheck=node('input');allCheck.type='checkbox';allCheck.style.width='auto';allCheck.checked=selected.length===rooms.length;all.append(allCheck,document.createTextNode(' Tutte le stanze'));wrap.append(all);const boxes=[];rooms.forEach(r=>{const label=node('label');const cb=node('input');cb.type='checkbox';cb.style.width='auto';cb.value=r.id;cb.checked=selected.includes(r.id);boxes.push(cb);label.append(cb,document.createTextNode(' '+r.name));wrap.append(label)});allCheck.onchange=()=>boxes.forEach(b=>b.checked=allCheck.checked);p.append(wrap);return()=>boxes.filter(x=>x.checked).map(x=>x.value)}
async function manage(body){const {data,error}=await sb.functions.invoke('manage-user',{body});if(error)throw Error(error.message);if(data?.error)throw Error(data.error);return data}
function renderUsers(){const c=$('#content');c.replaceChildren();const box=node('section','','panel'),head=node('div','','row between');add(head,node('h2','Utenti'),button('＋ Aggiungi utente',()=>userDialog()));box.append(head);profiles.filter(u=>u.role==='user').forEach(u=>{const row=node('div','','item clickable');row.append(node('div',u.username+(u.archived?' · ARCHIVIATO':'')));row.onclick=()=>userDialog(u);const actions=node('div','','actions');add(actions,button(u.archived?'Riattiva':'Archivia',async()=>{try{await manage({action:'update',id:u.id,username:u.username,archived:!u.archived});await refresh()}catch(e){fail(e)}}),button('Elimina',async()=>{if(confirm('Eliminare definitivamente questo account?'))try{await manage({action:'delete',id:u.id});await refresh()}catch(e){fail(e)}},'danger'));actions.onclick=e=>e.stopPropagation();row.append(actions);box.append(row)});c.append(box)}
function userDialog(u){let name,pass,getRooms;dialog(u?'Modifica utente':'Aggiungi utente',p=>{name=input(p,'Username (lettere minuscole, numeri, _)',u?.username||'');pass=input(p,u?'Nuova password (vuoto = invariata)':'Password (minimo 10 caratteri)','', 'password');p.append(node('div','Stanze autorizzate','tag'));getRooms=roomSelector(p,u?access.filter(a=>a.user_id===u.id).map(a=>a.room_id):rooms.map(r=>r.id));if(u)p.append(node('p','La password esistente non è visibile per sicurezza.','muted'))},async()=>{await manage({action:u?'update':'create',id:u?.id,username:name.value,password:pass.value,room_ids:getRooms(),archived:u?.archived||false})},u?'Salva':'Aggiungi')}
function renderSettings(){const c=$('#content');c.replaceChildren();const p=node('section','','panel');p.append(node('h2','Impostazioni'));p.append(button('Modalità manutenzione: cambia stato',async()=>{try{const s=await request(sb.from('settings').select('*').single());await request(sb.from('settings').update({maintenance:!s.maintenance}).eq('id',true));alert(s.maintenance?'Piattaforma riattivata':'Manutenzione attivata')}catch(e){fail(e)}}));p.append(node('p','Per cambiare la password ADMIN usa Authentication → Users nel pannello Supabase.','muted'));c.append(p)}
async function renderChat(silent=false){const r=current;if(!r)return;const c=$('#content');if(!silent)c.replaceChildren();let items;try{items=await request(sb.from('messages').select('*').eq('room_id',r.id).order('created_at',{ascending:true}).limit(300))}catch(e){if(!silent)fail(e);return}
if(silent){const newer=items.filter(m=>!lastPublic.has(m.id)&&m.author_id!==me.id);if(ready&&newer.length&&!mute)tone(false);if(!newer.length&&c.querySelector('.messages'))return}
lastPublic=new Set(items.map(m=>m.id));c.replaceChildren();c.append(button('← Torna alle stanze',()=>{current=null;render()}));const grid=node('div','','chatgrid'),panel=node('section','','panel'),history=node('div','','messages');items.forEach(m=>{const line=node('div','','msg'),name=node('strong',username(m.author_id)+'  ');name.style.color=m.author_id===profiles.find(p=>p.role==='admin')?.id?'#ff7777':['#80c4ff','#e7cc72','#93e6aa','#f7a87c'][Math.abs(username(m.author_id).charCodeAt(0)||0)%4];add(line,name,node('small',fmt(m.created_at),'muted'));if(m.hidden)line.append(node('div','Segnalato — visibile solo ad ADMIN','tag'));if(m.body)line.append(node('div',m.body));if(m.image_path){const img=node('img');img.alt='Foto allegata';line.append(img);sb.storage.from('room-images').createSignedUrl(m.image_path,3600).then(({data})=>{if(data)img.src=data.signedUrl})}if(isAdmin()){const a=node('div','','actions');add(a,button(m.hidden?'Sblocca':'Segnala',async()=>{try{await request(sb.from('messages').update({hidden:!m.hidden}).eq('id',m.id));await renderChat()}catch(e){fail(e)}}),button('Elimina',async()=>{if(confirm('Eliminare messaggio?'))try{await request(sb.from('messages').delete().eq('id',m.id));await renderChat()}catch(e){fail(e)}},'danger'));line.append(a)}history.append(line)});panel.append(history);const label=node('label');const cb=node('input');cb.type='checkbox';cb.style.width='auto';cb.checked=mute;cb.onchange=()=>mute=cb.checked;label.append(cb,document.createTextNode(' Silenzia Chat (non silenzia i privati)'));panel.append(label);const compose=node('div','','composer'),ta=node('textarea');ta.placeholder='Scrivi… Invio va a capo';const emoji=button('☺',()=>{ta.value+=' ⚽';ta.focus()}),upload=node('input');upload.type='file';upload.accept='image/jpeg,image/png,image/webp,image/gif';upload.style.width='145px';upload.onchange=()=>files=upload.files?.[0]||null;const send=button('Invia',async()=>{try{let path=null;if(files){if(files.size>5*1024*1024)throw Error('Foto massimo 5 MB');if(!['image/jpeg','image/png','image/webp','image/gif'].includes(files.type))throw Error('Formato foto non supportato');path=`${r.id}/${me.id}/${crypto.randomUUID()}.${files.type.split('/')[1]}`;await request(sb.storage.from('room-images').upload(path,files,{contentType:files.type}));files=null}if(!ta.value.trim()&&!path)return;await request(sb.from('messages').insert({room_id:r.id,author_id:me.id,body:ta.value,image_path:path}));await renderChat()}catch(e){fail(e)}});compose.append(ta,emoji,upload,send);panel.append(compose);const members=node('aside','','members');members.append(node('h2','Partecipanti'));profiles.filter(p=>p.role==='admin'||access.some(a=>a.user_id===p.id&&a.room_id===r.id)).forEach(p=>{const n=node('div',p.username);n.style.color=p.role==='admin'?'#ff7777':'#85c7ff';members.append(n)});members.append(node('p','Elenco utenti autorizzati, non indicatore di presenza.','muted'));grid.append(panel,members);c.append(grid);history.scrollTop=history.scrollHeight}
async function loadPrivate(notify=false){if(!me)return;const data=await request(sb.from('private_messages').select('*').order('created_at',{ascending:true}).limit(500));const incoming=data.filter(m=>m.receiver_id===me.id&&!m.read_at);const fresh=incoming.filter(m=>!lastPrivate.has(m.id));if(notify&&ready&&fresh.length){tone(true);document.title=`(${incoming.length}) Hai ricevuto un messaggio — PES Classic Room`;}
privateData=data;lastPrivate=new Set(data.map(m=>m.id));const badge=$('#unread');badge.textContent=incoming.length;badge.classList.toggle('hidden',!incoming.length);if(!incoming.length)document.title='PES Classic Room';ready=true}
function tone(priv){try{const A=window.AudioContext||window.webkitAudioContext;const ctx=new A(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(priv?820:540,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(priv?1040:670,ctx.currentTime+.11);gain.gain.setValueAtTime(.045,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.24);osc.onended=()=>ctx.close()}catch{}}
$('#privateButton').onclick=()=>{privateOpen=!privateOpen;renderPrivate()};
async function renderPrivate(){const p=$('#privatePanel');p.replaceChildren();p.classList.toggle('hidden',!privateOpen);if(!privateOpen)return;const h=node('div','','row between');h.append(node('h2',isAdmin()?'Contatta utenti':'Contatta ADMIN'),button('✕',()=>{privateOpen=false;renderPrivate()}));p.append(h);if(isAdmin()){const select=node('select');select.append(new Option('Seleziona utente',''));profiles.filter(x=>x.role==='user').forEach(x=>select.append(new Option(x.username,x.id)));select.value=peer||'';select.onchange=()=>{peer=select.value;renderPrivate()};p.append(select);if(!peer)return}else peer=profiles.find(x=>x.role==='admin')?.id;if(!peer){p.append(node('p','Admin non disponibile'));return}
const history=node('div','','privatehistory');privateData.filter(m=>(m.sender_id===me.id&&m.receiver_id===peer)||(m.receiver_id===me.id&&m.sender_id===peer)).forEach(m=>{const line=node('div','','msg');line.append(node('strong',username(m.sender_id)),node('div',m.body),node('small',fmt(m.created_at),'muted'));history.append(line)});p.append(history);const unread=privateData.filter(m=>m.sender_id===peer&&m.receiver_id===me.id&&!m.read_at);if(unread.length){await request(sb.from('private_messages').update({read_at:new Date().toISOString()}).in('id',unread.map(m=>m.id)));await loadPrivate()}
