$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  const errorBox=$('#loginError'),submit=$('#loginForm button[type=submit],#loginForm button');
  errorBox.textContent='';
  if(!configured){errorBox.textContent='Servizio momentaneamente non disponibile.';return}
  const name=$('#username').value.trim().toLowerCase();
  if(!/^[a-z0-9_.-]{3,32}$/.test(name)){errorBox.textContent='Username non valido.';return}
  submit.disabled=true;
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:`${name}@pcr.invalid`,password:$('#password').value});
    if(error){
      console.error('Autenticazione Supabase:',{status:error.status,code:error.code,message:error.message});
      errorBox.textContent=error.code==='invalid_credentials'||error.status===400
        ?'Supabase non riconosce la password per questo account. Verifica le credenziali o reimposta la password in modo sicuro.'
        :error.code==='email_not_confirmed'?'Account non confermato su Supabase.'
        :'Autenticazione non riuscita ('+(error.code||error.status||'errore di rete')+').';
      return;
    }
    if(!data?.session){errorBox.textContent='Supabase non ha restituito una sessione valida.';return}
    try{await enter()}catch(err){
      console.error('Caricamento dashboard:',err);
      errorBox.textContent='Accesso riuscito, ma impossibile caricare la dashboard. Controlla la console del browser.';
    }
  }catch(err){console.error('Connessione login:',err);errorBox.textContent='Problema di connessione. Riprova tra poco.'}
  finally{submit.disabled=false}
};

// Porta la cronologia della room all'ultimo messaggio, senza spostare l'intera pagina.
function scrollChatToLatest(history){
  if(!history?.isConnected)return;
  history.scrollTop=history.scrollHeight;
  requestAnimationFrame(()=>{
    if(!history.isConnected)return;
    history.scrollTop=history.scrollHeight;
    requestAnimationFrame(()=>{if(history.isConnected)history.scrollTop=history.scrollHeight});
  });
}
const attachmentTypes={
 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif',
 'application/pdf':'pdf','text/plain':'txt','application/zip':'zip',
 'application/x-zip-compressed':'zip','application/msword':'doc',
 'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx',
 'application/vnd.ms-excel':'xls','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx',
 'application/vnd.ms-powerpoint':'ppt','application/vnd.openxmlformats-officedocument.presentationml.presentation':'pptx'
};
function isImagePath(path){return /\.(jpg|jpeg|png|webp|gif)$/i.test(path||'')}
function attachmentName(path){const part=(path||'').split('/').pop()||'Allegato';return part.replace(/^[0-9a-f-]{36}_/i,'')}
function attachmentElement(path,history){
 const el=isImagePath(path)?node('img'):node('a','📎 '+attachmentName(path),'attachment-file');
 if(el.tagName==='IMG'){el.alt='Foto allegata';el.addEventListener('load',()=>scrollChatToLatest(history),{once:true})}
 else {el.target='_blank';el.rel='noopener noreferrer';el.download=attachmentName(path)}
 sb.storage.from('room-images').createSignedUrl(path,3600).then(({data,error})=>{if(error||!data?.signedUrl){if(el.tagName==='A')el.textContent='Allegato non disponibile';return}if(el.tagName==='IMG')el.src=data.signedUrl;else el.href=data.signedUrl});
 return el;
}
async function renderChat(silent=false){
 const r=current;if(!r)return;
 const c=$('#content');
 let items;
 try{items=await request(sb.from('messages').select('*').eq('room_id',r.id).order('created_at',{ascending:true}).limit(300))}
 catch(e){if(!silent)fail(e);return}
 if(current?.id!==r.id)return;
 const freshRoom=rooms.find(x=>x.id===r.id)||r;
 const pinned=items.find(m=>m.id===freshRoom.pinned_message_id);
 if(silent){
  const newer=items.filter(m=>!lastPublic.has(m.id)&&m.author_id!==me.id);
  if(ready&&newer.length&&!mute)tone(false);
  if(!newer.length&&c.querySelector('.messages')){scrollChatToLatest(c.querySelector('.messages'));return}
 }

  head.append(node('strong','📌 MESSAGGIO FISSATO'));
  if(isAdmin())head.append(button('Rimuovi pin',async()=>{try{await request(sb.from('rooms').update({pinned_message_id:null}).eq('id',r.id));const room=rooms.find(x=>x.id===r.id);if(room)room.pinned_message_id=null;await renderChat()}catch(e){fail(e)}}));
  pinBox.append(head);
  pinBox.append(node('div',pinned?(username(pinned.author_id)+': '+(pinned.body|| (pinned.image_path?'📎 '+attachmentName(pinned.image_path):''))):'Messaggio fissato non presente negli ultimi 300 messaggi','pinned-content'));
  panel.append(pinBox);
 }
 items.forEach(m=>{
  const line=node('div','','msg'+(m.id===freshRoom.pinned_message_id?' is-pinned':''));
  const name=node('strong',username(m.author_id)+'  ');name.style.color=userColor(m.author_id);
  add(line,name,node('small',fmt(m.created_at),'muted'));
  if(m.hidden)line.append(node('div','Segnalato — visibile solo ad ADMIN','tag'));
  if(m.body)line.append(node('div',m.body));
  if(m.image_path)line.append(attachmentElement(m.image_path,history));
  if(isAdmin()){
   const a=node('div','','actions');
   add(a,button(m.id===freshRoom.pinned_message_id?'Depinna':'📌 Pinna',async()=>{
    try{const next=m.id===freshRoom.pinned_message_id?null:m.id;
     await request(sb.from('rooms').update({pinned_message_id:next}).eq('id',r.id));
     const room=rooms.find(x=>x.id===r.id);if(room)room.pinned_message_id=next;
     await renderChat();
    }catch(e){fail(e)}
   }),button(m.hidden?'Sblocca':'Segnala',async()=>{try{await request(sb.from('messages').update({hidden:!m.hidden}).eq('id',m.id));await renderChat()}catch(e){fail(e)}}),button('Elimina',async()=>{if(confirm('Eliminare messaggio?'))try{await request(sb.from('messages').delete().eq('id',m.id));await renderChat()}catch(e){fail(e)}},'danger'));
   line.append(a);
  }
  history.append(line);
 });
 panel.append(history);
 const label=node('label'),cb=node('input');cb.type='checkbox';cb.style.width='auto';cb.checked=mute;cb.onchange=()=>mute=cb.checked;label.append(cb,document.createTextNode(' Silenzia Chat (non silenzia i privati)'));panel.append(label);
 const compose=node('div','','composer'),ta=node('textarea');ta.placeholder='Scrivi..';
 const emoji=emojiPicker(ta),send=button('Invia',async()=>{
  if(send.disabled)return;

  let path=null;

   const picked=files;
   if(picked){

   }

async function loadPrivate(notify=false){if(!me)return;const data=await request(sb.from('private_messages').select('*').order('created_at',{ascending:true}).limit(500));const incoming=data.filter(m=>m.receiver_id===me.id&&!m.read_at);const fresh=incoming.filter(m=>!lastPrivate.has(m.id));if(notify&&ready&&fresh.length){tone(true);document.title=`(${incoming.length}) Hai ricevuto un messaggio — PES Classic Room`;}

function tone(priv){try{if(!audioCtx)return;const ctx=audioCtx,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(priv?820:540,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(priv?1040:670,ctx.currentTime+.11);gain.gain.setValueAtTime(.045,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.23);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.24);osc.onended=()=>{osc.disconnect();gain.disconnect()}}catch{}}

async function renderPrivate(){const p=$('#privatePanel');p.replaceChildren();p.classList.toggle('hidden',!privateOpen);if(!privateOpen)return;const h=node('div','','row between');h.append(node('h2',isAdmin()?'Contatta utenti':'Contatta ADMIN'),button('✕',()=>{privateOpen=false;renderPrivate()}));p.append(h);if(isAdmin()){const select=node('select');select.append(new Option('Seleziona utente',''));profiles.filter(x=>x.role==='user').forEach(x=>select.append(new Option(x.username,x.id)));select.value=peer||'';select.onchange=()=>{peer=select.value;renderPrivate()};p.append(select);if(!peer)return}else peer=profiles.find(x=>x.role==='admin')?.id;if(!peer){p.append(node('p','Admin non disponibile'));return}

const compose=node('div','','row'),ta=node('textarea');ta.placeholder='Scrivi..';ta.style.flex='1';const privateSend=button('Invia',async()=>{try{if(!ta.value.trim())return;await request(sb.from('private_messages').insert({sender_id:me.id,receiver_id:peer,body:ta.value.trim()}));await loadPrivate();renderPrivate()}catch(e){fail(e)}});ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();privateSend.click()}});compose.append(ta,emojiPicker(ta),privateSend);p.append(compose);history.scrollTop=history.scrollHeight}
