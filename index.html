<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL='https://cxgshhodbhgmhnnfnctp.supabase.co';
const SUPABASE_KEY='sb_publishable_q7IjlqieQ8n55RTPtuS9aA_CzYFpkc7';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_KEY.startsWith('INCOLLA');
const sb=configured?createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;
const $=s=>document.querySelector(s),node=(tag,text='',className='')=>{const x=document.createElement(tag);x.textContent=text;x.className=className;return x};const add=(p,...children)=>p.append(...children);const button=(text,action,cls='')=>{const b=node('button',text,cls);b.onclick=action;return b};const fmt=d=>new Date(d).toLocaleString('it-IT');const fail=e=>{console.error(e);alert('Operazione non riuscita: '+(e?.message||String(e)))};

let activity=[],activityTimer=null,userSort='created',dashboardTicker=null,sessionLogged=false,publicMessageSignature='';

function pendingMentions(roomId){return mentionRecords.filter(x=>!x.read_at&&(!roomId||x.room_id===roomId)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}
function showMentionNotice(m){mentionTarget=m;$('#mentionNoticeText').textContent=username(m.sender_id)+' ti ha taggato nella room '+(rooms.find(r=>r.id===m.room_id)?.name||'');$('#mentionOverlay').classList.remove('hidden');tone(true)}
$('#mentionDismiss').onclick=()=>$('#mentionOverlay').classList.add('hidden');
$('#mentionGo').onclick=()=>{$('#mentionOverlay').classList.add('hidden');if(mentionTarget)goToMention(mentionTarget)};
async function loadMentions(notify=false){if(!me)return;try{const data=await request(sb.from('room_mentions').select('*').eq('recipient_id',me.id).order('created_at',{ascending:false}).limit(500));const fresh=data.filter(x=>!mentionKnown.has(x.id)&&!x.read_at);mentionRecords=data;mentionKnown=new Set(data.map(x=>x.id));if(mentionReady&&notify&&fresh.length)showMentionNotice(fresh[fresh.length-1]);mentionReady=true;if(current&&$('#mentionBanner'))updateMentionBanner()}catch(e){console.warn('Tag:',e)}}
function updateMentionBanner(){const b=$('#mentionBanner');if(!b||!current)return;const unread=pendingMentions(current.id);b.classList.toggle('hidden',!unread.length);b.textContent='🔔 Hai '+unread.length+' tag '+(unread.length===1?'non letto':'non letti')+' — Vai al messaggio';b.onclick=()=>goToMention(unread[0])}
async function goToMention(m){const room=rooms.find(r=>r.id===m.room_id);if(!room||!canRoom(room)){alert('Stanza non accessibile');return}if(current?.id!==room.id)openRoom(room);await renderChat();const el=document.getElementById('room-message-'+m.message_id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('mention-target');setTimeout(()=>el.classList.remove('mention-target'),3500)}try{await request(sb.from('room_mentions').update({read_at:new Date().toISOString()}).eq('id',m.id).eq('recipient_id',me.id));mentionRecords=mentionRecords.map(x=>x.id===m.id?{...x,read_at:new Date().toISOString()}:x);updateMentionBanner();const line=document.getElementById('room-message-'+m.message_id);if(line)line.classList.remove('mention-highlight')}catch(e){console.warn(e)}}

function linkedText(value){

 const re=/https?:\/\/[^\s<>\"'`]+/gi;
 let pos=0,match;
 while((match=re.exec(text))!==null){
  if(match.index>pos)container.append(document.createTextNode(text.slice(pos,match.index)));
  const candidate=match[0];
  const urlText=candidate.replace(/[.,!?;:]+$/,'').replace(/\)+$/,'');
  const trailing=candidate.slice(urlText.length);
  try{
   const parsed=new URL(urlText);
   if((parsed.protocol==='https:'||parsed.protocol==='http:')&&parsed.hostname){
    const link=node('a',urlText);
    link.href=parsed.href;link.target='_blank';link.rel='noopener noreferrer';
    link.className='chat-link';container.append(link);
   }else container.append(document.createTextNode(urlText));
  }catch{container.append(document.createTextNode(urlText))}
  if(trailing)container.append(document.createTextNode(trailing));
  pos=re.lastIndex;
 }
 if(pos<text.length)container.append(document.createTextNode(text.slice(pos)));
 return container;
}

async function loadHonors(initial=false){
 if(!me||honorBusy)return;honorBusy=true;
 try{
  const [entries,events]=await Promise.all([
   request(sb.from('honor_entries').select('id,user_id,trophy_name,created_at').order('created_at',{ascending:true})),
   request(sb.from('honor_events').select('id,user_id,created_at').order('id',{ascending:false}).limit(50))
  ]);
  honors=entries||[];honorEvents=events||[];
  const newest=honorEvents[0]?.id||0;
  if(honorInitialized&&newest>honorLastEvent&&!isAdmin()){
   const changes=honorEvents.filter(e=>e.id>honorLastEvent);
   showHonorNotice(changes.some(e=>e.user_id===me.id));
  }
  honorLastEvent=Math.max(honorLastEvent,newest);honorInitialized=true;
  if(view==='honors'&&!current)renderHonors();
 }catch(e){console.warn('Albo d’oro:',e)}finally{honorBusy=false}
}

// Porta la cronologia della room all'ultimo messaggio, senza spostare l'intera pagina.
function scrollChatToLatest(history){
  if(!history?.isConnected)return;
  history.scrollTop=history.scrollHeight;
  requestAnimationFrame(()=>{
    if(!history.isConnected)return;
    history.scrollTop=history.scrollHeight;
    requestAnimationFrame(()=>{if(history.isConnected)history.scrollTop=history.scrollHeight});
  });
}

function isImagePath(path){return /\.(jpg|jpeg|png|webp|gif)$/i.test(path||'')}

function attachmentElement(path,history){
 const el=isImagePath(path)?node('img'):node('a','📎 '+attachmentName(path),'attachment-file');
 if(el.tagName==='IMG'){el.alt='Foto allegata';el.addEventListener('load',()=>scrollChatToLatest(history),{once:true})}
 else {el.target='_blank';el.rel='noopener noreferrer';el.download=attachmentName(path)}

 return el;
}

function compNotifyEditor(c){let field;dialog('🔔 Avvisa partecipanti — '+c.name,p=>{field=node('textarea');field.rows=6;field.placeholder='Messaggio per i partecipanti';field.value=c.last_notice||'';p.append(field,node('p','L’avviso viene recapitato solo ai partecipanti selezionati, anche al prossimo accesso.','muted'))},async()=>{if(!field.value.trim())throw Error('Scrivi un messaggio');await request(sb.rpc('pcr_send_competition_notice',{p_competition_id:c.id,p_body:field.value.trim()}));await loadCompetitions()},'AVVISA UTENTI')}
function compTable(c,ids,container){const standings=compStandings(ids,c.id);const table=node('div','','comp-table');const heading=node('div','POS.   GIOCATORE   V   S   P   PT','comp-table-head');table.append(heading);standings.forEach((m,i)=>{const line=node('div','','comp-standing'+(compAdmin()?' clickable':''));line.append(node('span',(i+1)+'°  '+compUserName(m.user_id)),node('strong',`${m.wins}   ${m.losses}   ${m.draws}   ${m.points}`));if(compAdmin())line.onclick=()=>compScoreEditor(m);table.append(line)});container.append(table)}
function compScoreEditor(m){let w,l,d,pt;dialog('Classifica — '+compUserName(m.user_id),p=>{w=input(p,'Vittorie',m.wins||0,'number');l=input(p,'Sconfitte',m.losses||0,'number');d=input(p,'Pareggi',m.draws||0,'number');pt=input(p,'Punti',m.points||0,'number')},async()=>{const vals=[w,l,d,pt].map(x=>Number(x.value));if(vals.some(x=>!Number.isInteger(x)||x<0))throw Error('Inserisci numeri interi non negativi');await request(sb.from('pcr_competition_members').update({wins:vals[0],losses:vals[1],draws:vals[2],points:vals[3],score_updated_at:new Date().toISOString()}).eq('competition_id',m.competition_id).eq('user_id',m.user_id));await loadCompetitions()},'SALVA')}
function compMatchEditor(c,m){let h,a,played,qualified;dialog('Risultato incontro',p=>{p.append(node('p',compUserName(m.home_id)+' vs '+compUserName(m.away_id)));h=input(p,'Gol casa',m.home_score,'number');a=input(p,'Gol ospite',m.away_score,'number');const lab=node('label');played=node('input');played.type='checkbox';played.style.width='auto';played.checked=m.played;lab.append(played,document.createTextNode(' Risultato confermato'));p.append(lab);if(c.kind==='tournament'&&c.format!=='groups'){p.append(node('div','Qualificato al turno successivo','tag'));qualified=node('select');qualified.append(new Option('Da decidere',''),new Option(compUserName(m.home_id),m.home_id),new Option(compUserName(m.away_id),m.away_id));qualified.value=m.winner_id||'';p.append(qualified)}},async()=>{const hs=Number(h.value),as=Number(a.value);if(!Number.isInteger(hs)||!Number.isInteger(as)||hs<0||as<0)throw Error('Risultato non valido');await request(sb.from('pcr_competition_matches').update({home_score:hs,away_score:as,played:played.checked,winner_id:qualified?.value||null}).eq('id',m.id));await loadCompetitions()},'SALVA')}
async function compRegenerate(c){const games=compMatchesFor(c.id);if(games.some(m=>m.played||m.home_score!==0||m.away_score!==0)){alert('Rigenerazione bloccata: esiste almeno un risultato salvato.');return}if(!confirm('Generare nuove combinazioni?'))return;try{await compGenerate(c,compActiveMembers(c.id).map(x=>x.user_id),true);compRound=0;await loadCompetitions()}catch(e){fail(e)}}
async function compNextRound(c){const games=compMatchesFor(c.id),round=Math.max(0,...games.map(m=>m.round_no)),currentGames=games.filter(m=>m.round_no===round);if(!currentGames.length||currentGames.some(m=>!m.played||!m.winner_id)){alert('Conferma i risultati e scegli tutti i qualificati.');return}const winners=currentGames.map(m=>m.winner_id);if(winners.length<2){alert('Il torneo ha già un vincitore.');return}if(!confirm('Generare il prossimo turno?'))return;const shuffled=[...winners].sort(()=>Math.random()-.5),rows=[];for(let i=0;i<shuffled.length;i+=2)if(shuffled[i+1])rows.push({competition_id:c.id,round_no:round+1,match_no:rows.length+1,home_id:shuffled[i],away_id:shuffled[i+1],home_score:0,away_score:0,played:false});if(rows.length){try{await request(sb.from('pcr_competition_matches').insert(rows));compRound=round;await loadCompetitions()}catch(e){fail(e)}}}
function renderCompetitionDetail(c,root){const box=node('section','','panel');box.append(button('← Tutte le competizioni',()=>{compActive=null;renderCompetitions()}),node('h2',(c.kind==='league'?'🏆 LEGA · ':'🏟️ TORNEO · ')+c.name));box.append(node('p','Formula: '+c.format+' · Squadre: '+({clubs:'Club',national:'Nazionali',both:'Entrambi'}[c.teams]||c.teams)+' · Durata: '+c.duration+' min · Condizione: '+(c.condition==='red'?'Tutti rossi':'Casuale'),'muted'));const ids=compActiveMembers(c.id).map(x=>x.user_id);box.append(node('p','Partecipanti: '+ids.map(compUserName).join(', '),'muted'));const matches=compMatchesFor(c.id);if(c.kind==='league'||c.format==='groups'){box.append(node('h2',c.format==='groups'?'Classifica girone':'Classifica'));compTable(c,ids,box)}box.append(node('h2',c.kind==='tournament'&&c.format!=='groups'?'Tabellone eliminazione':'📅 CALENDARIO'));const rounds=[...new Set(matches.map(x=>x.round_no))].sort((a,b)=>a-b);if(rounds.length){compRound=Math.min(compRound,rounds.length-1);const rno=rounds[compRound],nav=node('div','','row between');nav.append(button('◀',()=>{compRound=Math.max(0,compRound-1);renderCompetitions()}),node('strong','Giornata / Turno '+rno+' di '+rounds.length),button('▶',()=>{compRound=Math.min(rounds.length-1,compRound+1);renderCompetitions()}));box.append(nav);matches.filter(m=>m.round_no===rno).forEach(m=>{const line=node('div','','item'+(compAdmin()?' clickable':''));line.append(node('span',compUserName(m.home_id)+'  '+m.home_score+' - '+m.away_score+'  '+compUserName(m.away_id)+(m.played?' ✓':'')));if(compAdmin()){line.append(button('✎ Risultato',()=>compMatchEditor(c,m)));line.onclick=()=>compMatchEditor(c,m)}box.append(line)})}else box.append(node('p','Calendario non ancora disponibile','muted'));if(compAdmin()){const actions=node('div','','row');if(c.kind==='league'||c.format==='groups'){const regen=button('🔀 RIGENERA',()=>compRegenerate(c));regen.disabled=matches.some(m=>m.played||m.home_score!==0||m.away_score!==0);actions.append(regen)}else actions.append(button('PROSSIMO TURNO',()=>compNextRound(c)));box.append(actions)}root.append(box)}

</script></body></html>
